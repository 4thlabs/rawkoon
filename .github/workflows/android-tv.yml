name: Android TV CI

on:
  push:
    branches: [main]
    paths: ["apps/android-tv/**", ".github/workflows/android-tv.yml"]
  pull_request:
    paths: ["apps/android-tv/**", ".github/workflows/android-tv.yml"]

defaults:
  run:
    working-directory: apps/android-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android-tv/**/*.gradle.kts', 'apps/android-tv/gradle/libs.versions.toml', 'apps/android-tv/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Test + lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      # Writes keystore.properties only when the signing secrets are present, so
      # assembleRelease produces a SIGNED, sideloadable APK. Without them (e.g. a
      # fork) it no-ops and the release build stays unsigned.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set — release build will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rawkoon-tv-release
          path: apps/android-tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
